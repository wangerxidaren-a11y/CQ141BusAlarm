name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android project
        run: python3 generate.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: CQ141BusAlarm
        run: |
          gradle clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CQ141BusAlarm-v1.2-custom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQ141BusAlarm-v1.2-custom
          path: CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v1.2-custom.apk
          if-no-files-found: error

      - name: Publish Release with Direct APK Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.2 --yes || true
          gh release create v1.2 CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v1.2-custom.apk --title "公交强提醒 v1.2（自由监听任意线路）" --notes "直接点击下方 CQ141BusAlarm-v1.2-custom.apk 即可下载安装，无需解压。"
