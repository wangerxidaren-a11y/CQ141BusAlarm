name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android project
        run: python3 generate.py

      - name: Restore fixed signing key
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "::error::SIGNING_BUNDLE_B64 secret is missing; refusing to build with an ephemeral debug key"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$SIGNING_BUNDLE_B64" | base64 -d | tar -xzf - -C "$RUNNER_TEMP/signing"
          cat "$RUNNER_TEMP/signing/signing.env" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/cq141-fixed.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: CQ141BusAlarm
        run: |
          gradle clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CQ141BusAlarm-v1.3-custom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQ141BusAlarm-v1.3-custom
          path: CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v1.3-custom.apk
          if-no-files-found: error

      - name: Publish Release with Direct APK Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3 --yes || true
          gh release create v1.3 CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v1.3-custom.apk --title "公交强提醒 v1.3（固定签名，可覆盖更新）" --notes "v1.3 起使用固定签名：从 v1.2 升级需最后一次卸载旧版重装；此后新版本可直接覆盖更新，不再重设权限。直接点击下方 CQ141BusAlarm-v1.3-custom.apk 即可下载安装，无需解压。"
