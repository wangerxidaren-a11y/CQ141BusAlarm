name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android project
        run: python3 generate.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: CQ141BusAlarm
        run: |
          gradle clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CQ141BusAlarm-v1.1-allday.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQ141BusAlarm-v1.1-allday
          path: CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v1.1-allday.apk
          if-no-files-found: error
