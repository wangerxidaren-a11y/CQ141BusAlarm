name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android project
        run: python3 generate.py

      - name: Derive fixed signing key
        env:
          SIGNING_SEED: ${{ secrets.SIGNING_SEED }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
          SIGNING_OUT_DIR: ${{ runner.temp }}/signing
        run: |
          if [ -z "$SIGNING_SEED" ] || [ -z "$SIGNING_CERT_B64" ]; then
            echo "::error::SIGNING_SEED / SIGNING_CERT_B64 secrets are missing; refusing to build with an ephemeral debug key"
            exit 1
          fi
          python3 -m pip install --quiet "cryptography==50.0.2" || python3 -m pip install --quiet --break-system-packages "cryptography==50.0.2"
          python3 gen_keystore.py
          cat "$SIGNING_OUT_DIR/signing.env" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$SIGNING_OUT_DIR/cq141-fixed.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: CQ141BusAlarm
        run: |
          gradle clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CQ141BusAlarm-v2.2-custom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQ141BusAlarm-v2.2-custom
          path: CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v2.2-custom.apk
          if-no-files-found: error

      - name: Publish Release with Direct APK Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2 --yes || true
          gh release create v2.2 CQ141BusAlarm/app/build/outputs/apk/debug/CQ141BusAlarm-v2.2-custom.apk --title "公交强提醒 v2.2（可爱实时位置板）" --notes "v2.2：实时位置板换成可爱站牌风——奶油色圆角卡、橙色轨道点、你的站有珊瑚红标记，每辆车是小药丸标贴在它所在站旁（橙色=正在开来，灰色=已开过），每30秒刷新。含 v2.0.3 全部改动（无时段、站名点选）。固定签名，直接覆盖安装即可。"
